<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Contact Us</h2>
    <form id="contactForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
    </form>

    <p id="statusMessage"></p>

    <script>
        // REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz5Aj7i-kUVFlPQ8sTiPCIc9ZtSBwWgXBrrYjjHpdM3Q50VIacc5saI9WJBnP82RaJmdg/exec';

        const form = document.getElementById('contactForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            statusMessage.style.color = 'black';
            statusMessage.innerText = 'Submitting...';

            const payload = {
                name: form.name.value,
                email: form.email.value,
                message: form.message.value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Bypasses CORS policy restriction for Google Apps Script
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                statusMessage.style.color = 'green';
                statusMessage.innerText = 'Form submitted successfully!';
                form.reset();
                submitBtn.disabled = false;
            })
            .catch(error => {
                statusMessage.style.color = 'red';
                statusMessage.innerText = 'Error submitting form. Please try again.';
                console.error('Error!', error.message);
                submitBtn.disabled = false;
            });
        });
    </script>

</body>
</html>
